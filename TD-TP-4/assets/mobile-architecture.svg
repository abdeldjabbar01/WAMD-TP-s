<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-label="Parfumi mobile application architecture">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071225"/><stop offset="1" stop-color="#101d3a"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2c4b73" stroke-opacity=".15"/></pattern></defs>
<rect width="1600" height="760" rx="30" fill="url(#bg)"/><rect width="1600" height="760" rx="30" fill="url(#grid)"/>
<text x="90" y="105" fill="#f4f8ff" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="750">APPLICATION ARCHITECTURE</text>
<text x="92" y="148" fill="#9eb4d3" font-family="Inter,Arial,sans-serif" font-size="22">The mobile client communicates with the shared Express API and MongoDB database</text>
<!-- arrows -->
<path d="M470 360 H585 M1015 360 H1130" stroke="#7397c2" stroke-width="6" stroke-linecap="round"/>
<path d="M565 345 L585 360 L565 375 M1110 345 L1130 360 L1110 375" fill="none" stroke="#7397c2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<!-- client -->
<rect x="90" y="240" width="380" height="255" rx="24" fill="#10284a" stroke="#9b8cff" stroke-width="2.5"/>
<text x="132" y="300" fill="#c3baff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">CLIENT</text>
<text x="132" y="355" fill="#f4f8ff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">React Native + Expo</text>
<text x="132" y="402" fill="#9eb4d3" font-family="Inter,Arial,sans-serif" font-size="20">Customer and admin screens</text>
<text x="132" y="440" fill="#9eb4d3" font-family="Inter,Arial,sans-serif" font-size="20">Cart · Products · Orders · Account</text>
<!-- api -->
<rect x="585" y="240" width="430" height="255" rx="24" fill="#102d42" stroke="#55e0d0" stroke-width="2.5"/>
<text x="630" y="300" fill="#55e0d0" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">SERVER</text>
<text x="630" y="355" fill="#f4f8ff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Express REST API</text>
<text x="630" y="402" fill="#9eb4d3" font-family="Inter,Arial,sans-serif" font-size="20">Authentication · Products · Orders</text>
<text x="630" y="440" fill="#9eb4d3" font-family="Inter,Arial,sans-serif" font-size="20">JWT protection · Admin access</text>
<!-- db -->
<rect x="1130" y="240" width="380" height="255" rx="24" fill="#152743" stroke="#42b8ff" stroke-width="2.5"/>
<text x="1175" y="300" fill="#42b8ff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">PERSISTENCE</text>
<text x="1175" y="355" fill="#f4f8ff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">MongoDB</text>
<text x="1175" y="402" fill="#9eb4d3" font-family="Inter,Arial,sans-serif" font-size="20">users · products · orders</text>
<text x="1175" y="440" fill="#9eb4d3" font-family="Inter,Arial,sans-serif" font-size="20">Shared by web and mobile</text>
<!-- footnote -->
<rect x="90" y="570" width="1420" height="105" rx="18" fill="#0b1a31" stroke="#24466e"/>
<text x="130" y="615" fill="#f4f8ff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">One backend, two experiences</text>
<text x="130" y="649" fill="#9eb4d3" font-family="Inter,Arial,sans-serif" font-size="19">TP 03 introduces the full-stack web architecture, while TP 04 reuses the same API and data model for mobile.</text>
</svg>